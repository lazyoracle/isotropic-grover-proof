name: Lean Action CI

on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BUILD_CACHE_PATHS: |
        .lake/build
        .lake/packages/physlib/.lake/build
        .lake/packages/formal-quantum-computation/.lake/build
      DOCS_CACHE_PATHS: |
        docbuild/lakefile.toml
        docbuild/lake-manifest.json
        docbuild/.root-manifest.sha256
        docbuild/.lake/build
        .lake/packages/doc-gen4
        .lake/packages/MD4Lean
        .lake/packages/BibtexQuery
        .lake/packages/UnicodeBasic
        .lake/packages/leansqlite
        .lake/packages/Cli/.lake/build

    steps:
      - uses: actions/checkout@v5

      # Install elan, clone the dependencies, and fetch the Mathlib cache so
      # the build cache below can be restored into the package checkouts.
      - name: Fetch dependencies and the Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          use-github-cache: false
          build: false
          test: false
          lint: false

      # Cache only build outputs that `lake exe cache get` does not provide:
      # this repository's, physlib's, and formal-quantum-computation's.
      # Caching the whole `.lake` (~7 GB, mostly Mathlib) makes cache restore
      # and save the slowest steps of the job.
      - name: Restore build cache
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: lake-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Build project
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: false
          use-github-cache: false
          test: false
          lint: false
          build-args: '--wfail'
          axiom-audit: true
          axiom-audit-root: 'IsotropicGroverProof'

      - name: Save build cache
        if: success() && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Restore docs cache
        id: docs-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.DOCS_CACHE_PATHS }}
          key: docs-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: docs-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-

      - name: Configure VM overcommit for doc-gen4
        run: sudo sysctl -w vm.overcommit_memory=1

      - name: Build API documentation
        run: ./scripts/build_docs.sh

      - name: Save docs cache
        if: success() && steps.docs-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.DOCS_CACHE_PATHS }}
          key: ${{ steps.docs-cache-restore.outputs.cache-primary-key }}

      - name: Upload website (API documentation)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _pages/

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v5
