name: Lean Action CI

on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_dispatch:

# Default read-only permissions; Pages write permissions are scoped to the deploy job
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BUILD_CACHE_PATHS: |
        .lake/build
        .lake/packages/physlib/.lake/build
        .lake/packages/formal-quantum-computation/.lake/build
      DOCS_CACHE_PATHS: |
        docbuild/lakefile.toml
        docbuild/lake-manifest.json
        docbuild/.root-manifest.sha256
        docbuild/.lake/build/api-docs.db
        docbuild/.lake/build/doc-data/*.doc
        docbuild/.lake/build/doc-data/*.doc.hash
        docbuild/.lake/build/doc-data/*.doc.trace
        docbuild/.lake/build/doc-data/references.json*
        .lake/packages/doc-gen4
        .lake/packages/MD4Lean
        .lake/packages/BibtexQuery
        .lake/packages/UnicodeBasic
        .lake/packages/leansqlite
        .lake/packages/Cli/.lake/build

    steps:
      - uses: actions/checkout@v5

      - name: Check Markdown math formatting
        run: |
          python3 -B -m unittest scripts/test_check_markdown_math.py
          python3 -B scripts/check_markdown_math.py english-proof.md README.md

      # Install elan, clone the dependencies, and fetch the Mathlib cache so
      # the build cache below can be restored into the package checkouts.
      - name: Fetch dependencies and the Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          use-github-cache: false
          build: false
          test: false
          lint: false

      # Cache only build outputs that `lake exe cache get` does not provide:
      # this repository's, physlib's, and formal-quantum-computation's.
      # Caching the whole `.lake` (~7 GB, mostly Mathlib) makes cache restore
      # and save the slowest steps of the job.
      - name: Restore build cache
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: lake-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Build project
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: false
          use-github-cache: false
          test: false
          lint: false
          build-args: '--wfail'
          axiom-audit: true
          axiom-audit-root: 'IsotropicGroverProof'

      - name: Save build cache
        if: success() && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Restore docs cache
        id: docs-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.DOCS_CACHE_PATHS }}
          key: docs-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
          restore-keys: docs-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-

      - name: Configure VM overcommit for doc-gen4
        run: sudo sysctl -w vm.overcommit_memory=1

      - name: Build API documentation
        run: ./scripts/build_docs.sh

      - name: Save docs cache
        if: success() && steps.docs-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.DOCS_CACHE_PATHS }}
          key: ${{ steps.docs-cache-restore.outputs.cache-primary-key }}

      - name: Upload website (API documentation)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _pages/

  paper:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install TeX Live packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-publishers \
            texlive-pictures \
            texlive-science \
            cm-super \
            poppler-utils \
            latexmk

      - name: Lint data, style, Lean declarations, and build PDFs
        run: bash scripts/build_paper.sh

      - name: Upload manuscript PDFs
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-pdfs
          if-no-files-found: error
          path: |
            paper/build/main.pdf
            paper/build/supplement.pdf
            paper/build/arxiv.pdf

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
